name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Borg 1.4.4
        # #82's runtime boundary refuses anything but the exact validated
        # capability profile (see src/borg/runtime.rs), pinned to 1.4.4 --
        # so CI needs that exact version at /usr/bin/borg. Building from
        # source via pip needs libxxhash-dev/liblz4-dev/libzstd-dev/
        # libssl-dev present; apt's own package is simpler when it carries
        # the exact version, so try that first and fail loudly rather than
        # silently accepting a different version if it doesn't.
        run: |
          sudo apt-get update
          sudo apt-get install -y borgbackup
          got="$(borg --version)"
          if [ "$got" != "borg 1.4.4" ]; then
            echo "::error::apt installed '$got', not 'borg 1.4.4' -- pin a source build instead"
            exit 1
          fi
          command -v borg
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Format
        run: cargo fmt --check

  audit:
    runs-on: ubuntu-latest
    # audit-check reports advisories as a check run; that API needs checks:write,
    # which the read-only default token does not carry.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
